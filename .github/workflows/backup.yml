      #   env:
      #     B2_BUCKET: ${{ secrets.B2_BUCKET }}
      #     B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      #     B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      #   run: |
      #     curl -sSf -o /tmp/b2 https://f001.backblazeb2.com/file/b2-cli/b2
      #     chmod +x /tmp/b2
      #     /tmp/b2 authorize-account "$B2_KEY_ID" "$B2_APPLICATION_KEY" >/dev/null
      #     for f in backup/*; do
      #       /tmp/b2 upload-file --noProgress "$B2_BUCKET" "$f" "clinic/$(basename "$f")"
      #     done
