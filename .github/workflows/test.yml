name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test + syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check every JS file
        run: |
          fail=0
          for f in js/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntax error in $f"
              fail=1
            fi
          done
          exit $fail

      - name: Unit tests
        run: npm test

      - name: Guard against committed secrets
        run: |
          # The anon key is public by design, but a service_role key must never
          # be committed. Fail the build if one shows up.
          if grep -rn "service_role" --include="*.js" --include="*.html" --include="*.toml" . \
               | grep -v -i "revoke\|comment\|--\|README\|POLICY\|must never\|never put"; then
            echo "::error::Possible service_role reference found in client code"
            exit 1
          fi
          echo "no service_role secrets in client code"
