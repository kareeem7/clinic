<body>

<section class="login-view">
  <div class="login-card" style="grid-template-columns:1fr;max-width:560px">
    <div class="login-form">
      <div class="p-chips"><span class="chip chip-teal"><i class="fa-solid fa-shield-halved"></i> إعادة تعيين كلمة المرور</span></div>
      <div>
        <h2>كلمة مرور جديدة</h2>
        <p class="muted">اكتب كلمة المرور الجديدة لحسابك. بعد الحفظ هترجع لصفحة الدخول وتكمل بالتحقق بخطوتين.</p>
      </div>

      <p id="recoveryStatus" class="muted" role="status" style="font-size:13.5px;font-weight:700">جارٍ التحقق من رابط الاستعادة…</p>
      <div id="recoveryError" class="form-error" role="alert" aria-live="polite"></div>
      <div id="recoveryOk" class="demo-hint" style="display:none">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i><span id="recoveryOkText"></span>
      </div>

      <form id="recoveryForm" class="auth-form hide" novalidate>
        <div class="field">
          <label for="recoveryPass">كلمة المرور الجديدة * (8 أحرف على الأقل)</label>
          <div class="in-wrap"><i class="fa-solid fa-lock"></i>
            <input id="recoveryPass" type="password" required dir="ltr" minlength="8" autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label for="recoveryPass2">تأكيد كلمة المرور *</label>
          <div class="in-wrap"><i class="fa-solid fa-lock"></i>
            <input id="recoveryPass2" type="password" required dir="ltr" minlength="8" autocomplete="new-password">
          </div>
        </div>
        <button class="btn btn-primary block" id="recoveryBtn" type="submit">
          <i class="fa-solid fa-check"></i><span>حفظ كلمة المرور</span>
        </button>
      </form>

      <div id="recoveryHelp" class="hide" style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        <a class="btn btn-outline block" href="index.html#reset"><i class="fa-solid fa-paper-plane"></i> اطلب رابط استعادة جديد</a>
        <a class="btn btn-ghost block" href="index.html"><i class="fa-solid fa-arrow-right"></i> العودة لتسجيل الدخول</a>
      </div>
    </div>
  </div>
</section>
